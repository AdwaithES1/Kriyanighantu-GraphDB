<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kriyānighaṇṭu Synonym Finder</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f4ee; --panel: #fffdf9; --ink: #27231d; --muted: #6d655a; --line: #e0d9cc;
  --accent: #9a3b12; --accent-ink: #fff; --soft: #f6e8df; --warn-bg: #fdf3d8; --warn-ink: #6f5200;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1916; --panel: #25221e; --ink: #f0ebe2; --muted: #aaa193; --line: #3b362f;
    --accent: #ef9a6d; --accent-ink: #2a1408; --soft: #3a2a20; --warn-bg: #3a3018; --warn-ink: #eed08a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 "Segoe UI", "Nirmala UI", "Noto Sans Devanagari", system-ui, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
h1 { font-size: 1.7rem; margin: 0; line-height: 1.25; }
.lead { color: var(--muted); margin: 6px 0 26px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
form .panel { display: grid; gap: 18px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend, label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; padding: 0; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle label { padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: .95rem; }
.toggle input:checked + label { background: var(--accent); color: var(--accent-ink); }
.toggle input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, input[type=text], input[type=file] {
  width: 100%; font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea { min-height: 110px; resize: vertical; }
[hidden] { display: none !important; }
button.go {
  justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 8px; padding: 10px 24px; font: inherit; font-weight: 600; cursor: pointer;
}
button.go:disabled { opacity: .6; cursor: progress; }
#results { margin-top: 22px; display: grid; gap: 16px; }
.sentence { color: var(--muted); font-size: .92rem; margin: 0 0 12px; }
.tag { font-size: .8rem; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin: 0; }
.best { font-size: 2.3rem; font-weight: 700; color: var(--accent); margin: 2px 0 4px; line-height: 1.25; overflow-wrap: anywhere; }
.forms { color: var(--muted); font-size: .92rem; margin: 0 0 10px; }
.meaning { margin: 12px 0 0; }
.gloss { color: var(--muted); font-size: .92rem; margin: 3px 0 0; }
.note { margin: 14px 0 0; padding: 9px 12px; border-radius: 8px; background: var(--soft); font-size: .92rem; }
.note.guess { background: var(--warn-bg); color: var(--warn-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font-size: .95rem; background: none; color: inherit; font-family: inherit; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); }
.section { margin-top: 16px; }
details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; font-size: .92rem; font-weight: 600; }
.other { margin-top: 10px; font-size: .92rem; }
.problem h2 { margin: 0 0 6px; font-size: 1.2rem; }
.problem p { margin: 0; }
.summary { color: var(--muted); font-size: .92rem; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Kriyānighaṇṭu Synonym Finder</h1>
  <p class="lead">Give a passage and a word from it. The app reads the context and picks the best Sanskrit synonym.</p>

  <form id="form">
    <div class="panel">
      <fieldset>
        <legend>Input type</legend>
        <div class="toggle">
          <input type="radio" name="mode" id="m-statement" value="statement" checked><label for="m-statement">Statement</label>
          <input type="radio" name="mode" id="m-text" value="text"><label for="m-text">Text file</label>
          <input type="radio" name="mode" id="m-pdf" value="pdf"><label for="m-pdf">PDF</label>
        </div>
      </fieldset>

      <div id="statement-input">
        <label class="field" for="text">Statement</label>
        <textarea id="text" name="text" placeholder="बालकः क्रीडायां चलति ।"></textarea>
      </div>
      <div id="file-input" hidden>
        <label class="field" for="file" id="file-label">File</label>
        <input type="file" id="file" name="file">
      </div>

      <div>
        <label class="field" for="word">Word from the input</label>
        <input type="text" id="word" name="word" placeholder="चलति" autocomplete="off">
      </div>
      <button class="go" id="go" type="submit">Find synonym</button>
    </div>
  </form>

  <div id="results" aria-live="polite"></div>
</main>

<script>
const form = document.getElementById('form');
const results = document.getElementById('results');
const go = document.getElementById('go');
const fileInput = document.getElementById('file');
const wordInput = document.getElementById('word');

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function meaningName(m) {
  return m.qualifier ? `${m.name} (${m.qualifier})` : m.name;
}

function chips(words, onPick) {
  const row = el('div', 'chips');
  for (const word of words) {
    const chip = el(onPick ? 'button' : 'span', 'chip', word);
    if (onPick) { chip.type = 'button'; chip.onclick = () => onPick(word); }
    row.append(chip);
  }
  return row;
}

function renderProblem(data) {
  const card = el('section', 'panel problem');
  card.append(el('h2', '', data.title), el('p', '', data.message));
  if (data.suggestions && data.suggestions.length) {
    const box = el('div', 'section');
    box.append(el('p', 'tag', data.suggestions_in_text ? 'Similar words in your text' : 'Similar verbs in the database'));
    box.append(chips(data.suggestions, data.suggestions_in_text ? word => { wordInput.value = word; form.requestSubmit(); } : null));
    card.append(box);
  }
  results.append(card);
}

function renderOccurrence(item) {
  const card = el('section', 'panel');
  card.append(el('p', 'sentence', item.sentence));
  const answer = item.answer;

  if (answer) {
    card.append(el('p', 'tag', answer.kind === 'exact' ? 'Best suited synonym' : 'Closest related word (no exact synonym)'));
    card.append(el('p', 'best', answer.best.word));
    if (answer.best.forms.length > 1) card.append(el('p', 'forms', 'Also: ' + answer.best.forms.slice(1).join(', ')));
    const meaning = el('p', 'meaning');
    meaning.append(el('strong', '', 'Meaning: '), document.createTextNode(meaningName(answer)));
    card.append(meaning);
    card.append(el('p', 'gloss', answer.gloss || 'The dataset has no English gloss for this meaning.'));
    card.append(el('p', 'note' + (item.certain ? '' : ' guess'),
      item.note + (answer.because.length ? ' Context words: ' + answer.because.join(', ') + '.' : '')));
    if (answer.alternatives.length) {
      const box = el('div', 'section');
      box.append(el('p', 'tag', 'Other synonyms for this meaning'));
      box.append(chips(answer.alternatives.map(a => a.word)));
      card.append(box);
    }
  } else {
    const box = el('div', 'problem');
    box.append(el('h2', '', item.explanation.title), el('p', '', item.explanation.message));
    card.append(box);
  }

  if (item.other_meanings.length) {
    const more = el('details');
    more.append(el('summary', '', `Other recorded meanings (${item.other_meanings.length})`));
    for (const m of item.other_meanings) {
      const row = el('div', 'other');
      row.append(el('strong', '', meaningName(m)));
      row.append(document.createTextNode(m.best ? ' → ' + m.best.word : ' → no synonym in the database'));
      if (m.gloss) row.append(el('div', 'gloss', m.gloss));
      more.append(row);
    }
    card.append(more);
  }
  results.append(card);
}

function render(data) {
  results.replaceChildren();
  if (data.status !== 'ok') return renderProblem(data);
  const shown = data.occurrences.length;
  const extra = data.occurrences_total > shown ? ` Showing the first ${shown} of ${data.occurrences_total}.` : '';
  if (data.occurrences_total > 1) results.append(el('p', 'summary', `“${data.word}” occurs in ${data.occurrences_total} sentences; each is read separately.${extra}`));
  data.occurrences.forEach(renderOccurrence);
}

function syncMode() {
  const mode = form.elements.mode.value;
  document.getElementById('statement-input').hidden = mode !== 'statement';
  document.getElementById('file-input').hidden = mode === 'statement';
  document.getElementById('file-label').textContent = mode === 'pdf' ? 'PDF file' : 'Text file (.txt)';
  fileInput.accept = mode === 'pdf' ? '.pdf,application/pdf' : '.txt,text/plain';
  fileInput.value = '';
  results.replaceChildren();
}
for (const radio of form.elements.mode) radio.addEventListener('change', syncMode);

form.addEventListener('submit', async event => {
  event.preventDefault();
  go.disabled = true;
  go.textContent = 'Reading…';
  try {
    const response = await fetch('/api/find', { method: 'POST', body: new FormData(form) });
    render(await response.json());
  } catch {
    render({ status: 'explained', title: 'The app is not responding', message: 'Check that the window running the app is still open, then try again.' });
  } finally {
    go.disabled = false;
    go.textContent = 'Find synonym';
  }
});
</script>
</body>
</html>
