<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synonym Finder · Kriyanighantu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Matches the Kriyanighantu site: Montserrat, blue headings, pale blue-grey page, white rounded cards. */
:root {
  color-scheme: light;
  --bg: #f4f7fc; --panel: #ffffff; --ink: #1f2937; --text: #4b5563; --muted: #6b7280; --line: #dfe5ef;
  --accent: #2453d4; --accent-dark: #1b40a8; --accent-ink: #ffffff; --eyebrow: #5550d6;
  --tile: #e8effb; --soft: #edf2fd; --warn-bg: #fff6df; --warn-ink: #7a5600;
  --radius: 18px;
  --font: "Montserrat", "Noto Sans Devanagari", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--font);
  display: flex; flex-direction: column; min-height: 100vh;
}
a { color: inherit; }
.wrap { width: 100%; max-width: 1064px; margin: 0 auto; padding: 0 24px; }

/* Header bar */
.site-header { border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 58px; }
.brand { color: var(--accent); font-weight: 700; font-size: 1.05rem; text-decoration: none; }
.site-nav { display: flex; gap: 22px; font-size: .95rem; }
.site-nav a { color: var(--text); text-decoration: none; }
.site-nav a[aria-current] { color: var(--accent); font-weight: 600; }

/* Page */
main { flex: 1; padding: 34px 0 56px; }
.eyebrow { color: var(--eyebrow); font-size: .78rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 10px; }
h1 { color: var(--accent); font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; line-height: 1.12; margin: 0; letter-spacing: -.01em; }
.lead { color: var(--text); max-width: 640px; margin: 14px 0 30px; }

/* The two finders, chosen like the site's "Search by ..." cards */
.finders { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; border: 0; padding: 0; margin: 0 0 22px; }
.finders legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.finder input { position: absolute; opacity: 0; pointer-events: none; }
.finder label {
  display: block; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 24px 26px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.finder label:hover { border-color: #b9c8ea; }
.finder input:checked + label { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(36, 83, 212, .08); }
.finder input:focus-visible + label { outline: 3px solid rgba(36, 83, 212, .35); outline-offset: 2px; }
.tile {
  display: inline-grid; place-items: center; width: 46px; height: 46px; border-radius: 12px;
  background: var(--tile); color: var(--ink); font-size: 1.2rem; margin-bottom: 18px;
}
.finder-title { display: block; color: var(--accent); font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
.finder-text { display: block; color: var(--text); font-size: .95rem; margin-top: 4px; }

/* Input panel */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
form .panel { display: grid; gap: 20px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend, label.field { display: block; color: var(--ink); font-weight: 600; font-size: .9rem; margin-bottom: 8px; padding: 0; }
.toggle { display: inline-flex; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle label { padding: 7px 18px; border-radius: 9px; cursor: pointer; font-size: .92rem; font-weight: 500; color: var(--text); }
.toggle input:checked + label { background: var(--accent); color: var(--accent-ink); }
.toggle input:focus-visible + label { outline: 3px solid rgba(36, 83, 212, .35); outline-offset: 2px; }
textarea, input[type=text], input[type=file] {
  width: 100%; font: inherit; color: var(--ink); background: #fbfcfe;
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
}
textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(36, 83, 212, .15); }
textarea { min-height: 120px; resize: vertical; }
[hidden] { display: none !important; }
button.go {
  justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 12px; padding: 11px 28px; font: inherit; font-weight: 600; cursor: pointer;
}
button.go:hover { background: var(--accent-dark); }
button.go:disabled { opacity: .6; cursor: progress; }
.hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }

/* Results */
#results { margin-top: 24px; display: grid; gap: 18px; }
#results .panel { padding: 24px 26px; }
.sentence { color: var(--muted); font-size: .92rem; margin: 0 0 12px; }
mark { background: var(--tile); color: var(--accent); border-radius: 5px; padding: 0 4px; font-weight: 600; }
.tag { font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--eyebrow); margin: 0; }
.best { font-size: 2.4rem; font-weight: 700; color: var(--accent); margin: 4px 0; line-height: 1.3; overflow-wrap: anywhere; }
.forms, .headword { color: var(--muted); font-size: .92rem; margin: 0 0 8px; }
.meaning { color: var(--ink); margin: 12px 0 0; }
.gloss { color: var(--muted); font-size: .92rem; margin: 3px 0 0; }
.note { margin: 16px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--soft); color: var(--ink); font-size: .92rem; }
.note.guess { background: var(--warn-bg); color: var(--warn-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 4px 14px; font-size: .95rem; background: var(--bg); color: var(--ink); font-family: inherit; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--accent); color: var(--accent); }
.section { margin-top: 18px; }
details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-size: .92rem; font-weight: 600; color: var(--ink); }
.other { margin-top: 10px; font-size: .92rem; }
.other strong { color: var(--ink); }
.problem h2 { color: var(--accent); margin: 0 0 6px; font-size: 1.2rem; }
.problem p { margin: 0; }
.summary { color: var(--text); font-size: .95rem; margin: 0; }

/* Footer */
.site-footer { background: #ffffff; border-top: 1px solid var(--line); }
.site-footer p { margin: 0; padding: 22px 0; text-align: center; color: var(--text); font-size: .88rem; }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .panel, #results .panel { padding: 20px; }
  .best { font-size: 2rem; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">Kriyanighantu</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/" aria-current="page">Synonym Finder</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">Kriyanighantu</p>
    <h1>Context-Aware Synonym Finder</h1>
    <p class="lead" id="lead"></p>

    <form id="form">
      <fieldset class="finders">
        <legend>Finder</legend>
        <div class="finder">
          <input type="radio" name="task" id="t-in-context" value="in_context" checked>
          <label for="t-in-context">
            <span class="tile" aria-hidden="true">अ</span>
            <span class="finder-title">Synonym for a word in the text</span>
            <span class="finder-text">Give a passage and a word from it. Its context decides the meaning, and the best synonym comes from the database.</span>
          </label>
        </div>
        <div class="finder">
          <input type="radio" name="task" id="t-in-text" value="in_text">
          <label for="t-in-text">
            <span class="tile" aria-hidden="true">अ</span>
            <span class="finder-title">Synonyms of a word, in the text</span>
            <span class="finder-text">Give a passage and any word. Find the words in the passage that are its synonyms, and the meaning they share.</span>
          </label>
        </div>
      </fieldset>

      <div class="panel">
        <fieldset>
          <legend>Input type</legend>
          <div class="toggle">
            <input type="radio" name="mode" id="m-statement" value="statement" checked><label for="m-statement">Statement</label>
            <input type="radio" name="mode" id="m-text" value="text"><label for="m-text">Text file</label>
            <input type="radio" name="mode" id="m-pdf" value="pdf"><label for="m-pdf">PDF</label>
          </div>
        </fieldset>

        <div id="statement-input">
          <label class="field" for="text">Statement</label>
          <textarea id="text" name="text" placeholder="बालकः क्रीडायां चलति ।"></textarea>
        </div>
        <div id="file-input" hidden>
          <label class="field" for="file" id="file-label">File</label>
          <input type="file" id="file" name="file">
        </div>

        <div>
          <label class="field" for="word" id="word-label">Word from the input</label>
          <input type="text" id="word" name="word" placeholder="चलति" autocomplete="off">
          <p class="hint" id="word-hint"></p>
        </div>
        <button class="go" id="go" type="submit">Find synonym</button>
      </div>
    </form>

    <div id="results" aria-live="polite"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>A collaborative project between IIIT Kottayam and CIFSS, supported by Central Sanskrit University</p>
  </div>
</footer>

<script>
const form = document.getElementById('form');
const results = document.getElementById('results');
const go = document.getElementById('go');
const fileInput = document.getElementById('file');
const wordInput = document.getElementById('word');

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function meaningName(m) {
  return m.qualifier ? `${m.name} (${m.qualifier})` : m.name;
}

function chips(words, onPick) {
  const row = el('div', 'chips');
  for (const word of words) {
    const chip = el(onPick ? 'button' : 'span', 'chip', word);
    if (onPick) { chip.type = 'button'; chip.onclick = () => onPick(word); }
    row.append(chip);
  }
  return row;
}

const TASKS = {
  in_context: {
    lead: 'Give a passage and a word from it. The app reads the context and picks the best Sanskrit synonym.',
    label: 'Word from the input',
    hint: 'The word must appear in the text; its sentence decides which meaning is meant.',
    button: 'Find synonym',
  },
  in_text: {
    lead: 'Give a passage and any word. The app finds the words in the passage that are its synonyms, reading each in its context.',
    label: 'Word to find synonyms of',
    hint: 'The word does not need to be in the text: a Sanskrit verb (चलति) or an English meaning (go, tremble).',
    button: 'Find in text',
  },
};
const task = () => form.elements.task.value;

function retry(word) { wordInput.value = word; form.requestSubmit(); }

function renderProblem(data) {
  const card = el('section', 'panel problem');
  card.append(el('h2', '', data.title), el('p', '', data.message));
  if (data.suggestions && data.suggestions.length) {
    // A spelling suggestion can be retried; in the in-text finder any database verb can be, since it need not be in the text.
    const canRetry = data.suggestions_in_text || (task() === 'in_text' && !data.suggestions_label);
    const label = data.suggestions_label || (data.suggestions_in_text ? 'Similar words in your text' : 'Similar verbs in the database');
    const box = el('div', 'section');
    box.append(el('p', 'tag', label));
    box.append(chips(data.suggestions, canRetry ? retry : null));
    card.append(box);
  }
  results.append(card);
}

function sentenceWith(sentence, token) {
  // The sentence with the matched word highlighted (it is rebuilt from tokens, so the word is present as typed).
  const line = el('p', 'sentence');
  const at = sentence.indexOf(token);
  if (at < 0) { line.textContent = sentence; return line; }
  line.append(document.createTextNode(sentence.slice(0, at)), el('mark', '', token),
              document.createTextNode(sentence.slice(at + token.length)));
  return line;
}

function renderMatch(item) {
  const card = el('section', 'panel');
  card.append(sentenceWith(item.sentence, item.token));
  card.append(el('p', 'tag', item.kind === 'exact' ? 'Synonym found in your text' : 'Related word found in your text (no exact synonym)'));
  card.append(el('p', 'best', item.token));
  if (item.headword !== item.token) card.append(el('p', 'headword', 'Dictionary form: ' + item.headword));
  const meaning = el('p', 'meaning');
  meaning.append(el('strong', '', 'Shared meaning: '), document.createTextNode(meaningName(item.meaning)));
  card.append(meaning);
  card.append(el('p', 'gloss', item.meaning.gloss || 'The dataset has no English gloss for this meaning.'));
  card.append(el('p', 'note' + (item.certain ? '' : ' guess'),
    item.note + (item.because.length ? ' Context words: ' + item.because.join(', ') + '.' : '')));
  results.append(card);
}

function renderMatches(data) {
  const n = data.matches_total, shown = data.matches.length;
  const extra = n > shown ? ` Showing the best ${shown}.` : '';
  results.append(el('p', 'summary',
    `Found ${n} word${n > 1 ? 's' : ''} in your text sharing a meaning with “${data.word}”, best match first.${extra}`));
  data.matches.forEach(renderMatch);
}

function renderOccurrence(item) {
  const card = el('section', 'panel');
  card.append(el('p', 'sentence', item.sentence));
  const answer = item.answer;

  if (answer) {
    card.append(el('p', 'tag', answer.kind === 'exact' ? 'Best suited synonym' : 'Closest related word (no exact synonym)'));
    card.append(el('p', 'best', answer.best.word));
    if (answer.best.forms.length > 1) card.append(el('p', 'forms', 'Also: ' + answer.best.forms.slice(1).join(', ')));
    const meaning = el('p', 'meaning');
    meaning.append(el('strong', '', 'Meaning: '), document.createTextNode(meaningName(answer)));
    card.append(meaning);
    card.append(el('p', 'gloss', answer.gloss || 'The dataset has no English gloss for this meaning.'));
    card.append(el('p', 'note' + (item.certain ? '' : ' guess'),
      item.note + (answer.because.length ? ' Context words: ' + answer.because.join(', ') + '.' : '')));
    if (answer.alternatives.length) {
      const box = el('div', 'section');
      box.append(el('p', 'tag', 'Other synonyms for this meaning'));
      box.append(chips(answer.alternatives.map(a => a.word)));
      card.append(box);
    }
  } else {
    const box = el('div', 'problem');
    box.append(el('h2', '', item.explanation.title), el('p', '', item.explanation.message));
    card.append(box);
  }

  if (item.other_meanings.length) {
    const more = el('details');
    more.append(el('summary', '', `Other recorded meanings (${item.other_meanings.length})`));
    for (const m of item.other_meanings) {
      const row = el('div', 'other');
      row.append(el('strong', '', meaningName(m)));
      row.append(document.createTextNode(m.best ? ' → ' + m.best.word : ' → no synonym in the database'));
      if (m.gloss) row.append(el('div', 'gloss', m.gloss));
      more.append(row);
    }
    card.append(more);
  }
  results.append(card);
}

function render(data) {
  results.replaceChildren();
  if (data.status !== 'ok') return renderProblem(data);
  if (data.task === 'in_text') return renderMatches(data);
  const shown = data.occurrences.length;
  const extra = data.occurrences_total > shown ? ` Showing the first ${shown} of ${data.occurrences_total}.` : '';
  if (data.occurrences_total > 1) results.append(el('p', 'summary', `“${data.word}” occurs in ${data.occurrences_total} sentences; each is read separately.${extra}`));
  data.occurrences.forEach(renderOccurrence);
}

function syncMode() {
  const mode = form.elements.mode.value;
  document.getElementById('statement-input').hidden = mode !== 'statement';
  document.getElementById('file-input').hidden = mode === 'statement';
  document.getElementById('file-label').textContent = mode === 'pdf' ? 'PDF file' : 'Text file (.txt)';
  fileInput.accept = mode === 'pdf' ? '.pdf,application/pdf' : '.txt,text/plain';
  fileInput.value = '';
  results.replaceChildren();
}
for (const radio of form.elements.mode) radio.addEventListener('change', syncMode);

function syncTask() {
  const t = TASKS[task()];
  document.getElementById('lead').textContent = t.lead;
  document.getElementById('word-label').textContent = t.label;
  document.getElementById('word-hint').textContent = t.hint;
  go.textContent = t.button;
  results.replaceChildren();
}
for (const radio of form.elements.task) radio.addEventListener('change', syncTask);
syncTask();

form.addEventListener('submit', async event => {
  event.preventDefault();
  go.disabled = true;
  go.textContent = 'Reading…';
  try {
    const response = await fetch('/api/find', { method: 'POST', body: new FormData(form) });
    render(await response.json());
  } catch {
    render({ status: 'explained', title: 'The app is not responding', message: 'Check that the window running the app is still open, then try again.' });
  } finally {
    go.disabled = false;
    go.textContent = TASKS[task()].button;
  }
});
</script>
</body>
</html>
