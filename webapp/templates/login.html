{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
    <div class="login-box">
      <p class="eyebrow">Data Entry Portal</p>
      <h1 style="font-size: 2rem">Log in</h1>
      <p class="lead">Only the data-entry portal needs a login. The two synonym finders are open to everyone.</p>
      <form method="post" action="{{ url_for('login_page') }}">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="panel">
          <div>
            <label class="field" for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div>
            <label class="field" for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          {% if error %}<p class="error-text" role="alert">{{ error }}</p>{% endif %}
          <button class="go" type="submit">Log in</button>
        </div>
      </form>
    </div>
{% endblock %}
