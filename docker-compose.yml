# docker compose up -d --build   ->  http://<this-machine's-IP>:5000 for everyone on the network
services:
  neo4j:
    image: neo4j:2025.12.1-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (8+ characters)}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j-data:/data
    ports:  # Neo4j Browser, reachable from this machine only, not the network
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    restart: unless-stopped

  app:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      WORKERS: ${WORKERS:-2}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j-data:
